name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_DISABLE_LINT: true
          CI: false

      - name: Verify Build Output
        run: |
          if [ -d "dist" ]; then
            echo "Found dist folder in root."
          else
            echo "Looking for hidden dist folders..."
            find . -name "dist" -type d
            # If dist is found nested inside an app directory, copy it to root
            NESTED_DIST=$(find . -name "dist" -type d | head -n 1)
            if [ ! -z "$NESTED_DIST" ] && [ "$NESTED_DIST" != "./dist" ]; then
              cp -r $NESTED_DIST ./dist
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
