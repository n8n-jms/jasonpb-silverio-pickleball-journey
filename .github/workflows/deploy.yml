name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate and Build Project
        id: build_step
        run: |
          # Find where package.json lives
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          # Go to that directory, install, and build
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund
          npm run build
          
          # Find where the compiled dist folder ended up and move it cleanly to a root export folder
          DIST_PATH=$(find . -name "dist" -type d -not -path "*/node_modules/*" | head -n 1)
          cd "$GITHUB_WORKSPACE"
          mkdir -p final_output
          cp -r "$PROJECT_DIR/$DIST_PATH"/. ./final_output/
        env:
          VITE_DISABLE_LINT: true
          CI: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
